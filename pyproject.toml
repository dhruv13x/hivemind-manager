[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemind-manager"
version = "4.2.0"
description = "A developer-friendly process manager and supervisor for Hivemind workspaces"
readme = "README.md"
requires-python = ">=3.8"

authors = [
  { name = "dhruv13x", email = "dhruv13x@gmail.com" }
]

license = { text = "MIT" }

classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",
]

keywords = [
  "hivemind",
  "procfile",
  "supervisor",
  "process-manager",
  "developer-tools",
  "microservices",
  "orchestration",
  "cli",
]

dependencies = [
  "tomli; python_version < '3.11'",
  "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/dhruv13x/hivemind-manager"
Source   = "https://github.com/dhruv13x/hivemind-manager"
Issues   = "https://github.com/dhruv13x/hivemind-manager/issues"

[project.scripts]
hm = "hm.cli:main"
hivemind-manager = "hm.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "pytest-mock>=3.10.0",
  "pytest-timeout>=2.2.0",
  "ruff>=0.6.0",
  "black>=24.3.0",
  "mypy>=1.11.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
strict = false

[tool.pytest.ini_options]
pythonpath = ["src"]

testpaths = ["tests"]

addopts = [
  "-v",
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--tb=short",
  "--showlocals",

  "--cov=src/hm",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=html",
  "--cov-report=xml",
  "--cov-fail-under=90",
]

[tool.coverage.run]
branch = true
source = ["src/hm"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.hm]
home_dir = "hm"
preserve_logs = true
max_log_history = 5
max_log_size_mb = 0.0
